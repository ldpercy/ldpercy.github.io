<!doctype html>
<html lang="en" data-colourscheme="light">
<head>
	<title>ldpercy.github.io</title>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="" id="meta-themeColor"/>
	<link rel="icon" href="./favicon.svg">
	<link rel="stylesheet" href="./index.css">
	<script type="module" src="./index.js"></script>
</head>
<body>
	<header>
		<h1>
			<a href="/ldpercy.github.io/">ldpercy.github.io</a> <!-- LlIi -->
			<!-- <span title="Happy Christmas!">🎄</span> -->
		</h1>
		<nav>
			<a id="colourScheme-toggle" class="colourScheme-selector" href="?colourScheme=toggle" title="Toggle colour scheme" data-colourscheme="toggle">
				<svg id="colourScheme-svg" viewBox="-320 -320 640 640" preserveAspectRatio="xMidYMid meet"><path /></svg>
			</a>

			<a href="https://github.com/ldpercy/" title="https://github.com/ldpercy/">
				<img src="./favicon.svg" alt="github.com/ldpercy" title="github.com/ldpercy"/>
			</a>
		</nav>
	</header>

	<!-- <svg>
		<defs>
			<filter id="blurMe">
				<feGaussianBlur in="SourceGraphic" stdDeviation="5" edgeMode=""/>
			</filter>
		</defs>
	</svg> -->


	<!-- Project card template
	-->
	<template id="template-projectCard" ><!-- shadowrootmode="open" open closed -->
		<style>
			@import "./style/text.css";
			@import "./style/project-card-shadowDom.css";
		</style>

		<header>
			<h3>
				<a class="project-title-anchor" href="">
					<slot name="project-name">{project-name}</slot>
				</a>
			</h3>
			<nav>
				<a class="project-icon-anchor" href="">
					<img class="project-icon" src="./favicon.svg"/> <!-- alt="Terry the turtle" title="Terry the turtle" -->
				</a>
			</nav>
		</header>

		<div class="project-body">
			<div class="project-text">
				<p class="project-description"> {project-description} </p>
				<dl>
					<dt>Site</dt>
					<dd>
						<a href="" id="project-site-link">
							<slot name="site">{project-site-link}</slot>
						</a>
					</dd>
					<dt>Repository</dt>
					<dd>
						<a href="" id="project-repository-link">
							<slot name="repository">{project-repository}</slot>
						</a>
					</dd>
					<dt>Status</dt>
					<dd><slot name="status">{project-status}</dd>
					<dt>Tag</dt>
					<dd><span class="tag">{project-tag}</dd>
					<dt>Version</dt>
					<dd><slot name="version">{project-version}</dd>
					<dt>Date</dt>
					<dd>
						<time class="release-date" datetime="">{release-date}</time>
					</dd>
				</dl>
			</div>
			<div class="project-image">
				<slot >project-image</slot>
			</div>
		</div>
	</template>


	<main>
		<!-- <h2 slot="project-name">Projects</h2> -->

		<!-- <project-card project-name="foo" project-path="foo/">
			test project
		</project-card> -->

		<project-card project-name="Turtle" project-path="turtle/">
		</project-card>


		<project-card project-name="Year Clock" project-path="year-clock/">
		</project-card>


		<project-card project-name="Screensaver" project-path="screensaver/">
		</project-card>


		<project-card project-name="Medit" project-path="medit/">
		</project-card>


		<project-card project-name="HTML Experiment" project-path="html-experiment/">
		</project-card>


		<project-card project-name="HTML Common" project-path="html-common/">
		</project-card>


		<project-card project-name="silverdata-js" project-path="silver-language/silverdata-js/">
		</project-card>

	</main>

</body>
</html>
